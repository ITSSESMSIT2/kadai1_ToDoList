<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>進捗管理ボード</title>
    <link rel="stylesheet" href="app.css" />
  </head>

  <body>
    <header>進捗管理ボード</header>
    <div id="firstPanel">
      <h2>新規タスクを追加</h2>
      <div>
        <span>タスク名</span><span>必須</span><span>期限</span
        ><span>ステータス</span>
      </div>

      <form id="inputGroup">
        <input type="text" name="taskName" id="taskName" />
        <input type="date" name="taskLimit" id="taskLimit" />
        <select name="taskStatus" id="taskStatus">
          <option value="0">未対応</option>
          <option value="1">処理中</option>
          <option value="2">完了</option>
        </select>
        <input type="submit" value="追加" id="addInput" />
      </form>
      <!-- この直下の</div>は、firstPanelを閉じる -->
    </div>

    <div id="secondPanel">
      <h2><span>タスク一覧</span><span id="showNams"></span></h2>
      <div id="info">
        <span>タスク名</span><span>期限</span><span>ステータス</span
        ><span>操作</span>
      </div>
      <div id="container"></div>
      <!-- この直下の</div>は、secondPanelを閉じる -->
    </div>
    <script src="app.js"></script>
  </body>
</html>
